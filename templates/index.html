<!DOCTYPE html>
<html>

<head>
    <title>Bulk Email Sender</title>
    /static/style.css
</head>

<body>

<div class="container">

    <div class="left-card">

        <h2>✏ Compose Message</h2>

        <form id="mailForm">

            <div class="row">

                <div class="field">
                    <label>Sender Name</label>
                    <input type="text"
                           name="sender_name"
                           placeholder="John Doe">
                </div>

                <div class="field">
                    <label>Your Gmail</label>
                    <input type="email"
                           name="sender_id"
                           placeholder="you@gmail.com"
                           required>
                </div>

            </div>

            <div class="row">

                <div class="field">
                    <label>16-Digit App Password</label>
                    <input type="password"
                           name="app_password"
                           required>
                </div>

                <div class="field">
                    <label>Email Subject</label>
                    <input type="text"
                           name="subject"
                           required>
                </div>

            </div>

            <label>Message Body</label>

            <textarea
                name="body"
                rows="12"
                placeholder="Write your email here..."
                required
            ></textarea>

        </form>

    </div>

    <div class="right-panel">

        <div class="card">

            <h2>👥 Recipients List</h2>

            <textarea
                id="recipients"
                form="mailForm"
                name="recipients"
                rows="9"
                placeholder="Paste emails..."
            ></textarea>

            <p class="count">
                Found Emails:
                <span id="found">0</span>
            </p>

        </div>

        <div class="card">

            <h2>📊 Delivery Progress</h2>

            <div class="stats">

                <div class="box">
                    <span id="total">0</span>
                    <small>TOTAL</small>
                </div>

                <div class="box">
                    <span id="sent">0</span>
                    <small>SENT</small>
                </div>

                <div class="box">
                    <span id="failed">0</span>
                    <small>FAILED</small>
                </div>

                <div class="box">
                    <span id="remaining">0</span>
                    <small>REMAINING</small>
                </div>

            </div>

            <button
                type="submit"
                form="mailForm"
                id="sendBtn"
                class="send-btn">
                ✈ Send Bulk Emails
            </button>

            <div id="status" class="status">
                Ready to send
            </div>

        </div>

    </div>

</div>

<script>

const recipients =
document.getElementById("recipients");

function updateCount(){

    let emails =
    recipients.value
    .replace(/,/g,"\n")
    .split(/\n/)
    .filter(x=>x.trim());

    document.getElementById("found").innerText =
    emails.length;

    document.getElementById("total").innerText =
    emails.length;

    document.getElementById("remaining").innerText =
    emails.length;
}

recipients.addEventListener(
"input",
updateCount
);
