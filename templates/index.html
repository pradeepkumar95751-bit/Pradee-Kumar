<!DOCTYPE html>
<html>
<head>
    <title>Bulk Email Sender</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="dashboard">
    <h2>Bulk Email Sender</h2>
    <form id="mailForm">
        <label>Sender Name (auto-fill):</label>
        <input type="text" name="sender_name" id="sender_name" required>

        <label>Sender ID (Gmail):</label>
        <input type="text" name="sender_id" id="sender_id" required>

        <label>App Password:</label>
        <input type="password" name="app_password" required>

        <label>Subject line:</label>
        <input type="text" name="subject" required>

        <label>Message Body:</label>
        <textarea name="body" rows="6" required></textarea>

        <label>Recipients:</label>
        <textarea name="recipients" rows="6" id="recipients" required></textarea>
        <p>Found: <span id="found">0</span></p>

        <button type="submit" id="sendBtn">Send All</button>
    </form>

    <div class="counters">
        <div>TOTAL: <span id="total">0</span></div>
        <div>SENT: <span id="sent">0</span></div>
        <div>FAILED: <span id="failed">0</span></div>
        <div>REMAINING: <span id="remaining">0</span></div>
    </div>
    <p id="status">Ready to send</p>

    <div class="cloudflare-box">
        <b>✔ Success! CLOUDFLARE Privacy - Help</b>
        <p style="color:red;">For testing only. If seen, report to site owner.</p>
    </div>
</div>

<script>
// Auto-fill Sender Name from Gmail ID
document.getElementById("sender_id").addEventListener("input", function(){
    const email = this.value.trim();
    if(email.includes("@")){
        const username = email.split("@")[0];
        const parts = username.split(/[._]/); // split by dot or underscore
        let name = parts.map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(" ");
        document.getElementById("sender_name").value = name;
    }
});

// Count recipients
document.getElementById("recipients").addEventListener("input", function(){
    const emails = this.value.replace(/,/g, "\n").split("\n").filter(e => e.trim() !== "");
    document.getElementById("found").innerText = emails.length;
});

// Form submit
document.getElementById("mailForm").addEventListener("submit", function(e){
    e.preventDefault();
    const formData = new FormData(this);
    const sendBtn = document.getElementById("sendBtn");
    sendBtn.disabled = true;
    document.getElementById("status").innerText = "Sending...";

    fetch("/send", { method: "POST", body: formData })
    .then(res => res.json())
    .then(data => {
        data.forEach(update => {
            document.getElementById("total").innerText = update.total;
            document.getElementById("sent").innerText = update.sent;
            document.getElementById("failed").innerText = update.failed;
            document.getElementById("remaining").innerText = update.remaining;
            document.getElementById("status").innerText = update.status + " → " + update.recipient;
        });
        sendBtn.disabled = false;
    })
    .catch(err => {
        document.getElementById("status").innerText = "Error occurred!";
        sendBtn.disabled = false;
    });
});
</script>
</body>
</html>
