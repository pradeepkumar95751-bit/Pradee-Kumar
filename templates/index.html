<!DOCTYPE html>
<html>
<head>
    <title>Secure Mail Console</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h2>Secure Mail Console</h2>
    <form method="POST">
        <label>Sender Name:</label>
        <input type="text" name="sender_name" placeholder="E.g., John Doe" required><br>

        <label>Your Gmail:</label>
        <input type="email" name="gmail_user" placeholder="you@gmail.com" required><br>

        <label>App Password:</label>
        <input type="password" name="app_password" placeholder="16-digit app password" required><br>

        <label>Email Subject:</label>
        <input type="text" name="subject" placeholder="Enter subject line..." required><br>

        <label>Message Body:</label>
        <textarea name="body" rows="6" placeholder="Write your email here..." required></textarea><br>

        <label>Recipients (one per line):</label>
        <textarea name="recipients" rows="6" placeholder="Paste emails here..." required></textarea><br>

        <button type="submit">Send All</button>
    </form>
</body>
</html>
