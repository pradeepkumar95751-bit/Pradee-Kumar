<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bulk Email Sender</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="dashboard">
  <h2>Bulk Email Sender</h2>
  <form id="mailForm">
    <label>Sender Name:</label>
    <input type="text" name="sender_name" required>
    <label>Your Gmail:</label>
    <input type="email" name="sender_id" required>
    <label>App Password:</label>
    <input type="password" name="app_password" required>
    <label>Subject:</label>
    <input type="text" name="subject" required>
    <label>Message:</label>
    <textarea name="body" rows="6" required></textarea>
    <label>Recipients:</label>
    <textarea name="recipients" id="recipients" rows="6" required></textarea>
    <p>Found: <span id="found">0</span></p>
    <div class="counters">
      <div>TOTAL: <span id="total">0</span></div>
      <div>SENT: <span id="sent">0</span></div>
      <div>FAILED: <span id="failed">0</span></div>
      <div>REMAINING: <span id="remaining">0</span></div>
    </div>
    <p id="status">Ready to send</p>
    <button type="submit" id="sendBtn">Send All</button>
    <div class="spam-box">
      <span class="spam-success">✔ Success!</span>
      <p class="spam-note">For testing only. If seen, report to site owner.</p>
      <div class="spam-footer">CLOUDFLARE • Privacy • Terms</div>
    </div>
  </form>
</div>
<script>
const recipientsBox = document.getElementById("recipients");
const foundCounter = document.getElementById("found");
function getRecipients() {
  return recipientsBox.value.replace(/,/g,"\n").split(/\n/).map(e=>e.trim()).filter(e=>e);
}
function updateCount() {
  const emails = getRecipients();
  foundCounter.innerText = emails.length;
  document.getElementById("total").innerText = emails.length;
  document.getElementById("remaining").innerText = emails.length;
}
recipientsBox.addEventListener("input", updateCount);
document.getElementById("mailForm").addEventListener("submit", e=>{
  e.preventDefault();
  const formData = new FormData(e.target);
  const btn = document.getElementById("sendBtn");
  const status = document.getElementById("status");
  btn.disabled = true; btn.innerText="Sending...";
  status.innerText="Connecting...";
  fetch("/send",{method:"POST",body:formData})
    .then(r=>r.json())
    .then(data=>{
      data.forEach(u=>{
        document.getElementById("total").innerText=u.total;
        document.getElementById("sent").innerText=u.sent;
        document.getElementById("failed").innerText=u.failed;
        document.getElementById("remaining").innerText=u.remaining;
        status.innerText=u.status+" → "+u.recipient;
      });
      btn.disabled=false; btn.innerText="Send All";
      alert("Mail sending completed!");
    })
    .catch(err=>{
      status.innerText="Error: "+err.message;
      btn.disabled=false; btn.innerText="Send All";
    });
});
</script>
</body>
</html>
