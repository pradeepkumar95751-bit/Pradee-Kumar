<!DOCTYPE html>
<html>
<head>
    <title>Secure Mail Console</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <!-- Left Column: Compose Message -->
    <div class="compose">
        <h2>Compose Message</h2>
        <form id="mailForm">
            <label>Sender Name:</label>
            <input type="text" name="sender_name" placeholder="E.g., John Doe" required>

            <label>Your Gmail:</label>
            <input type="email" name="gmail_user" placeholder="you@gmail.com" required>

            <label>App Password:</label>
            <input type="password" name="app_password" placeholder="16-char app password" required>

            <label>Email Subject:</label>
            <input type="text" name="subject" placeholder="Enter subject line..." required>

            <label>Message Body (Plain Text or HTML):</label>
            <textarea name="body" rows="6" placeholder="Write your email here... Spintax supported: {Hi|Hello|Hey}" required></textarea>

            <div class="spam-box">
                <span class="success">✔ Success!</span> CLOUDFLARE Privacy - Help
                <p class="warn">For testing only. If seen, report to site owner.</p>
            </div>

            <label>Recipients:</label>
            <textarea name="recipients" rows="6" placeholder="Paste emails (comma separated, new lines, or Excel copy)" required></textarea>

            <button type="submit" id="sendBtn" class="send-btn">Send All ✈</button>
        </form>
    </div>

    <!-- Right Column: Progress Monitor -->
    <div class="progress">
        <h2>Progress Monitor</h2>
        <div class="counters">
            <div class="box total">TOTAL: <span id="total">0</span></div>
            <div class="box sent">SENT: <span id="sent">0</span></div>
            <div class="box failed">FAILED: <span id="failed">0</span></div>
            <div class="box remaining">REMAINING: <span id="remaining">0</span></div>
        </div>
        <p class="status" id="status">Ready to send</p>
    </div>
</div>

<script>
document.getElementById("mailForm").addEventListener("submit", function(e){
    e.preventDefault();
    const formData = new FormData(this);
    const sendBtn = document.getElementById("sendBtn");
    sendBtn.disabled = true; // disable button while sending
    document.getElementById("status").innerText = "Sending...";

    fetch("/send", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("total").innerText = data.total;
        document.getElementById("sent").innerText = data.sent;
        document.getElementById("failed").innerText = data.failed;
        document.getElementById("remaining").innerText = data.remaining;
        document.getElementById("status").innerText = data.status;

        // popup alert after completion
        alert(`Mail sending completed!\nTotal: ${data.total}\nSent: ${data.sent}\nFailed: ${data.failed}\nRemaining: ${data.remaining}`);

        sendBtn.disabled = false; // enable button again
    })
    .catch(err => {
        document.getElementById("status").innerText = "Error occurred!";
        alert("Error: " + err);
        sendBtn.disabled = false;
    });
});
</script>
</body>
</html>
