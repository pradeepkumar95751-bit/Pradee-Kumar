<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Dashboard</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f4f7fb;
            color: #17233b;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .dashboard {
            width: 100%;
            max-width: 1250px;
            margin: 25px auto;
            padding: 0 18px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            align-items: start;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 5px 18px rgba(23, 35, 59, 0.08);
            border: 1px solid #eef2f7;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* =========================
           CARD HEADER
        ========================= */

        .card-header {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 18px;
        }

        .card-header i {
            font-size: 19px;
            color: #17233b;
        }

        .card-header h2 {
            font-size: 18px;
            font-weight: 800;
        }

        /* =========================
           FORM
        ========================= */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #18243b;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #d7e0ec;
            border-radius: 8px;
            outline: none;
            background: #fff;
            color: #27344b;
            font-family: inherit;
            font-size: 13px;
            transition: 0.2s ease;
        }

        input {
            height: 43px;
            padding: 0 13px;
        }

        textarea {
            resize: vertical;
            padding: 13px;
        }

        input::placeholder,
        textarea::placeholder {
            color: #7f8998;
        }

        input:focus,
        textarea:focus {
            border-color: #7aa7e8;
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.08);
        }

        .message-box {
            min-height: 260px;
        }

        .recipients-box {
            min-height: 135px;
        }

        /* =========================
           PASSWORD
        ========================= */

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 42px;
        }

        .toggle-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            color: #68778f;
        }

        /* =========================
           SPAM PROTECTION
        ========================= */

        .spam-section {
            margin-top: 26px;
        }

        .spam-title {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 9px;
        }

        .spam-title i {
            color: #17233b;
        }

        .captcha-box {
            height: 60px;
            border: 1px solid #d5dbe5;
            background: #fafbfd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            max-width: 270px;
        }

        .captcha-success {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }

        .captcha-check {
            width: 27px;
            height: 27px;
            background: #20a66a;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 14px;
        }

        .captcha-brand {
            text-align: right;
            font-size: 10px;
            font-weight: 800;
            color: #566273;
        }

        .captcha-brand small {
            display: block;
            font-weight: 400;
            font-size: 7px;
        }

        /* =========================
           RECIPIENT HEADER
        ========================= */

        .recipient-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 9px;
        }

        .recipient-heading {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .recipient-heading i {
            font-size: 19px;
        }

        .recipient-heading h2 {
            font-size: 18px;
            font-weight: 800;
        }

        .recipient-description {
            font-size: 11px;
            color: #65738a;
            margin-top: 4px;
        }

        .count-badge {
            background: #edf4ff;
            color: #397de8;
            padding: 6px 10px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        /* =========================
           PROGRESS MONITOR
        ========================= */

        .progress-header {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 18px;
        }

        .progress-header i {
            font-size: 19px;
        }

        .progress-header h2 {
            font-size: 18px;
            font-weight: 800;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-box {
            min-height: 90px;
            border: 1px solid #d8e1ed;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .stat-label {
            font-size: 11px;
            color: #687992;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 25px;
            font-weight: 700;
        }

        .total-value {
            color: #3e80ed;
        }

        .sent-value {
            color: #10ae79;
        }

        .failed-value {
            color: #f23e43;
        }

        .remaining-value {
            color: #f29b00;
        }

        /* =========================
           PROGRESS BAR
        ========================= */

        .progress-area {
            margin-top: 22px;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #16b77e;
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .ready-status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 18px 0 22px;
            font-size: 13px;
            font-weight: 600;
        }

        .ready-status i {
            font-size: 13px;
        }

        /* =========================
           SEND BUTTON
        ========================= */

        .send-btn {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 7px;
            background: #0ca774;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 9px;
            transition: 0.2s ease;
        }

        .send-btn:hover {
            background: #078f64;
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            background: #9ab5aa;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           MESSAGE ALERT
        ========================= */

        .alert {
            display: none;
            padding: 10px 12px;
            border-radius: 7px;
            margin-top: 12px;
            font-size: 12px;
        }

        .alert.show {
            display: block;
        }

        .alert.error {
            background: #fff0f0;
            color: #d82f35;
            border: 1px solid #ffd1d1;
        }

        .alert.success {
            background: #ecfbf5;
            color: #078a5e;
            border: 1px solid #c6f1df;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .right-column {
                gap: 20px;
            }
        }

        @media (max-width: 600px) {
            .dashboard {
                padding: 0 10px;
                margin: 12px auto;
            }

            .card {
                padding: 20px;
                border-radius: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .message-box {
                min-height: 220px;
            }

            .stats-grid {
                gap: 10px;
            }

            .stat-box {
                min-height: 80px;
            }

            .recipient-header {
                flex-direction: column;
            }

            .count-badge {
                align-self: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="dashboard">

    <div class="dashboard-grid">

        <!-- =====================================
             LEFT COLUMN - COMPOSE MESSAGE
        ====================================== -->

        <section class="card">

            <div class="card-header">
                <i class="fa-solid fa-pen-to-square"></i>
                <h2>Compose Message</h2>
            </div>

            <form id="emailForm">

                <div class="form-grid">

                    <!-- Sender Name -->
                    <div class="form-group">
                        <label for="senderName">
                            Sender Name
                        </label>

                        <input
                            type="text"
                            id="senderName"
                            placeholder="E.g., John Doe"
                        >
                    </div>


                    <!-- Gmail -->
                    <div class="form-group">
                        <label for="gmail">
                            Your Gmail
                        </label>

                        <input
                            type="email"
                            id="gmail"
                            placeholder="you@gmail.com"
                        >
                    </div>


                    <!-- App Password -->
                    <div class="form-group">

                        <label for="appPassword">
                            App Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="appPassword"
                                placeholder="16-char app password"
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                id="togglePassword"
                                aria-label="Show password"
                            >
                                <i class="fa-regular fa-eye"></i>
                            </button>

                        </div>

                    </div>


                    <!-- Subject -->
                    <div class="form-group">

                        <label for="subject">
                            Email Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            placeholder="Enter subject line..."
                        >

                    </div>


                    <!-- Message -->
                    <div class="form-group full">

                        <label for="message">
                            Message Body (Plain Text / HTML)
                        </label>

                        <textarea
                            id="message"
                            class="message-box"
                            placeholder="Write your email here... Spintax supported: {Hi|Hello} {name}"
                        ></textarea>

                    </div>

                </div>


                <!-- Spam Protection -->

                <div class="spam-section">

                    <div class="spam-title">
                        <i class="fa-solid fa-shield-halved"></i>
                        Spam Protection
                    </div>

                    <div class="captcha-box">

                        <div class="captcha-success">

                            <div class="captcha-check">
                                <i class="fa-solid fa-check"></i>
                            </div>

                            <span>Success!</span>

                        </div>

                        <div class="captcha-brand">
                            CLOUDFLARE
                            <small>Privacy • Help</small>
                        </div>

                    </div>

                </div>

            </form>

        </section>


        <!-- =====================================
             RIGHT COLUMN
        ====================================== -->

        <div class="right-column">


            <!-- =================================
                 RECIPIENTS
            ================================== -->

            <section class="card">

                <div class="recipient-header">

                    <div>

                        <div class="recipient-heading">

                            <i class="fa-solid fa-users"></i>

                            <h2>Recipients</h2>

                        </div>

                        <p class="recipient-description">
                            Paste emails (comma separated, new lines, or Excel copy)
                        </p>

                    </div>

                    <div
                        class="count-badge"
                        id="countBadge"
                    >
                        0 found
                    </div>

                </div>


                <textarea
                    id="recipients"
                    class="recipients-box"
                    placeholder="recipient1@example.com
recipient2@example.com"
                ></textarea>

            </section>


            <!-- =================================
                 PROGRESS MONITOR
            ================================== -->

            <section class="card">

                <div class="progress-header">

                    <i class="fa-solid fa-chart-pie"></i>

                    <h2>
                        Progress Monitor
                    </h2>

                </div>


                <!-- Stats -->

                <div class="stats-grid">

                    <!-- Total -->
                    <div class="stat-box">

                        <span class="stat-label">
                            TOTAL
                        </span>

                        <span
                            class="stat-value total-value"
                            id="totalCount"
                        >
                            0
                        </span>

                    </div>


                    <!-- Sent -->
                    <div class="stat-box">

                        <span class="stat-label">
                            SENT
                        </span>

                        <span
                            class="stat-value sent-value"
                            id="sentCount"
                        >
                            0
                        </span>

                    </div>


                    <!-- Failed -->
                    <div class="stat-box">

                        <span class="stat-label">
                            FAILED
                        </span>

                        <span
                            class="stat-value failed-value"
                            id="failedCount"
                        >
                            0
                        </span>

                    </div>


                    <!-- Remaining -->
                    <div class="stat-box">

                        <span class="stat-label">
                            REMAINING
                        </span>

                        <span
                            class="stat-value remaining-value"
                            id="remainingCount"
                        >
                            0
                        </span>

                    </div>

                </div>


                <!-- Progress -->

                <div class="progress-area">

                    <div class="progress-track">

                        <div
                            class="progress-fill"
                            id="progressFill"
                        ></div>

                    </div>

                </div>


                <!-- Status -->

                <div class="ready-status">

                    <i
                        class="fa-solid fa-circle-pause"
                        id="statusIcon"
                    ></i>

                    <span id="statusText">
                        Ready to send
                    </span>

                </div>


                <!-- Send -->

                <button
                    type="button"
                    class="send-btn"
                    id="sendAllBtn"
                >

                    <i class="fa-solid fa-paper-plane"></i>

                    Send All

                </button>


                <!-- Alert -->

                <div
                    class="alert"
                    id="alertBox"
                ></div>

            </section>

        </div>

    </div>

</div>


<script>

    /* ==========================================
       ELEMENTS
    ========================================== */

    const recipientsInput =
        document.getElementById("recipients");

    const countBadge =
        document.getElementById("countBadge");

    const totalCount =
        document.getElementById("totalCount");

    const sentCount =
        document.getElementById("sentCount");

    const failedCount =
        document.getElementById("failedCount");

    const remainingCount =
        document.getElementById("remainingCount");

    const progressFill =
        document.getElementById("progressFill");

    const sendAllBtn =
        document.getElementById("sendAllBtn");

    const statusText =
        document.getElementById("statusText");

    const statusIcon =
        document.getElementById("statusIcon");

    const alertBox =
        document.getElementById("alertBox");

    const togglePassword =
        document.getElementById("togglePassword");

    const appPassword =
        document.getElementById("appPassword");


    /* ==========================================
       PARSE RECIPIENTS
    ========================================== */

    function getRecipients() {

        const value =
            recipientsInput.value.trim();

        if (!value) {
            return [];
        }

        /*
         Supports:
         - New lines
         - Commas
         - Semicolons
         - Excel copied data
        */

        const emails = value
            .split(/[\n,;\t]+/)
            .map(email => email.trim())
            .filter(email => email.length > 0);

        /*
         Remove duplicates
        */

        return [...new Set(emails)];
    }


    /* ==========================================
       EMAIL COUNT
    ========================================== */

    function updateRecipientCount() {

        const recipients =
            getRecipients();

        const total =
            recipients.length;

        countBadge.textContent =
            `${total} found`;

        totalCount.textContent =
            total;

        remainingCount.textContent =
            total;

        sentCount.textContent =
            "0";

        failedCount.textContent =
            "0";

        progressFill.style.width =
            "0%";

        statusText.textContent =
            total > 0
                ? "Ready to send"
                : "Ready to send";
    }


    recipientsInput.addEventListener(
        "input",
        updateRecipientCount
    );


    /* ==========================================
       SHOW / HIDE PASSWORD
    ========================================== */

    togglePassword.addEventListener(
        "click",
        function () {

            if (appPassword.type === "password") {

                appPassword.type = "text";

                this.innerHTML =
                    '<i class="fa-regular fa-eye-slash"></i>';

            } else {

                appPassword.type = "password";

                this.innerHTML =
                    '<i class="fa-regular fa-eye"></i>';
            }

        }
    );


    /* ==========================================
       ALERT
    ========================================== */

    function showAlert(message, type) {

        alertBox.textContent =
            message;

        alertBox.className =
            `alert show ${type}`;

    }


    function hideAlert() {

        alertBox.className =
            "alert";

    }


    /* ==========================================
       SEND BUTTON - DEMO
    ========================================== */

    sendAllBtn.addEventListener(
        "click",
        function () {

            hideAlert();

            const recipients =
                getRecipients();

            /*
             No recipients
            */

            if (recipients.length === 0) {

                showAlert(
                    "Please add at least one recipient.",
                    "error"
                );

                return;
            }


            /*
             Frontend demo only.
             No real email is sent.
            */

            sendAllBtn.disabled =
                true;

            statusText.textContent =
                "Demo processing...";

            statusIcon.className =
                "fa-solid fa-spinner fa-spin";


            let sent = 0;
            let failed = 0;

            const total =
                recipients.length;


            function processNext() {

                if (sent + failed >= total) {

                    const completed =
                        sent + failed;

                    const percentage =
                        (completed / total) * 100;

                    progressFill.style.width =
                        percentage + "%";

                    remainingCount.textContent =
                        "0";

                    sentCount.textContent =
                        sent;

                    failedCount.textContent =
                        failed;

                    statusIcon.className =
                        "fa-solid fa-circle-check";

                    statusText.textContent =
                        "Demo completed";

                    sendAllBtn.disabled =
                        false;

                    showAlert(
                        `Demo completed: ${sent} processed successfully.`,
                        "success"
                    );

                    return;
                }


                /*
                 Simulated progress only.
                */

                setTimeout(() => {

                    sent++;

                    const completed =
                        sent + failed;

                    const percentage =
                        (completed / total) * 100;

                    sentCount.textContent =
                        sent;

                    failedCount.textContent =
                        failed;

                    remainingCount.textContent =
                        total - completed;

                    progressFill.style.width =
                        percentage + "%";

                    processNext();

                }, 250);

            }


            processNext();

        }
    );


    /* ==========================================
       INITIAL STATE
    ========================================== */

    updateRecipientCount();

</script>

</body>
</html>
